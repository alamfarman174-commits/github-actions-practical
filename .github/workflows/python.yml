name : Python Test

on :push

jobs :
  test:
    runs-on : Ubuntu-latest

   steps:
     -uses : actions/checkout@v4

    -uses : actions/setups-python@v5
    with:
      python-version: '3.12'
 
   -name: Install dependencies
    run : pip install pytest flake8

  -name :Check code
  run: flake8 app.py


  -name: Run tests
   run: pytest
